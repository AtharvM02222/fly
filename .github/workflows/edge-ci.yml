name: Edge CI
on:
  push:
    branches: [main, develop]
    paths:
      - 'edge/**'
      - '.github/workflows/edge-ci.yml'
  pull_request:
    paths:
      - 'edge/**'
      - '.github/workflows/edge-ci.yml'
jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black mypy pytest pytest-cov
      - name: Run ruff (lint)
        run: ruff check .
      - name: Run black (format check)
        run: black --check .
      - name: Run mypy (type check)
        run: mypy pipeline config
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests (excluding soak tests)
        run: pytest -k "not soak" --cov=pipeline --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./edge/coverage.xml
          flags: edge
  build-x86:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (x86_64)
        uses: docker/build-push-action@v5
        with:
          context: ./edge
          push: false
          tags: dronecds-edge:${{ github.sha }}-amd64
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
  build-arm:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (arm64/Jetson)
        uses: docker/build-push-action@v5
        with:
          context: ./edge
          push: false
          tags: dronecds-edge:${{ github.sha }}-arm64
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
